[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-point-scatterer-simulation"
version = "0.1.0"
description = "Reproducible SAR image formation simulation from coherent point scatterers."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
